name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Compile engine
        run: python -m py_compile skills/harness-sync/scripts/harness_sync.py
      - name: harnessSync_whenRunWithThrowawayHome_thenIsHermeticAndIdempotent
        run: bash tests/smoke_test.sh

  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Compile engine
        run: python -m py_compile skills/harness-sync/scripts/harness_sync.py
      - name: harnessSync_whenRunWithThrowawayHome_thenIsHermeticAndIdempotent
        env:
          DEMO_PYTHON: python
        run: bash tests/smoke_test.sh

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Lint markdown
        run: npx --yes markdownlint-cli2 "**/*.md"
